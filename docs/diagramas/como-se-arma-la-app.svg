  <rect class="hoja" x="288" y="112" width="160" height="48" rx="6" />
  <text x="300" y="133" font-size="12" font-weight="600">Notificaciones</text>
  <text class="mono muted" x="300" y="149" font-size="9">siempre montado</text>
  <rect class="mascara" x="288" y="248" width="160" height="48" rx="6" />
  <rect class="nodo" x="288" y="248" width="160" height="48" rx="6" />
  <text x="300" y="269" font-size="12" font-weight="600">AppConSesion</text>
  <text class="mono muted" x="300" y="285" font-size="9">con sesión</text>
  <rect class="mascara" x="288" y="384" width="160" height="48" rx="6" />
  <rect class="hoja" x="288" y="384" width="160" height="48" rx="6" />
  <text x="300" y="405" font-size="12" font-weight="600">Login · Registro · Espera</text>
  <text class="mono muted" x="300" y="421" font-size="9">sin sesión o cuenta no activa</text>
  <rect class="mascara" x="496" y="112" width="200" height="48" rx="6" />
  <rect class="hoja" x="496" y="112" width="200" height="48" rx="6" />
  <text x="508" y="133" font-size="12" font-weight="600">barra</text>
  <text class="mono muted" x="508" y="149" font-size="9">menú · tema · cuenta</text>
  <rect class="mascara" x="496" y="180" width="200" height="48" rx="6" />
  <rect class="foco" x="496" y="180" width="200" height="48" rx="6" />
  <rect class="etiqueta-foco" x="656" y="188" width="28" height="12" rx="2" />
  <text class="mono acento" x="670" y="197" font-size="7" text-anchor="middle" letter-spacing="0.08em">FOCO</text>
  <text x="508" y="201" font-size="12" font-weight="600">MapView</text>
  <text class="mono muted" x="508" y="217" font-size="9">lugares · nunca se desmonta</text>
  <rect class="mascara" x="496" y="248" width="200" height="48" rx="6" />
  <rect class="hoja" x="496" y="248" width="200" height="48" rx="6" />
  <text x="508" y="269" font-size="12" font-weight="600">Routes</text>
  <text class="mono muted" x="508" y="285" font-size="9">paneles y nuevo lugar</text>
  <rect class="mascara" x="496" y="316" width="200" height="48" rx="6" />
  <rect class="hoja" x="496" y="316" width="200" height="48" rx="6" />
  <text x="508" y="337" font-size="12" font-weight="600">MenuNavegacion</text>
  <text class="mono muted" x="508" y="353" font-size="9">menú lateral ☰</text>
  <rect class="mascara" x="496" y="384" width="200" height="48" rx="6" />
  <rect class="hoja" x="496" y="384" width="200" height="48" rx="6" />
  <text x="508" y="405" font-size="12" font-weight="600">InactivityDialog</text>
  <text class="mono muted" x="508" y="421" font-size="9">aviso antes de 2 h</text>

  <!-- Leyenda -->
  <line class="regla" x1="40" y1="464" x2="696" y2="464" />
  <text class="mono muted" x="40" y="488" font-size="8" letter-spacing="0.18em">LEYENDA</text>
  <rect class="nodo" x="112" y="478" width="16" height="12" rx="2" />
  <text class="muted" x="136" y="488" font-size="9">Contiene otros componentes</text>
  <rect class="hoja" x="288" y="478" width="16" height="12" rx="2" />
