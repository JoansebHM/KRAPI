<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 736 504" width="736" height="504" role="img" aria-labelledby="como-se-arma-la-app-title como-se-arma-la-app-desc">
  <title id="como-se-arma-la-app-title">Cómo se arma la app</title>
  <desc id="como-se-arma-la-app-desc">App, dentro de los proveedores de rutas, datos y sesión, muestra siempre las notificaciones y, según haya sesión y la cuenta esté activa, el login (o el registro, o la espera de aprobación) o AppConSesion, que contiene la barra, el mapa, los paneles, el menú y el aviso de inactividad.</desc>
  <defs>
    <style>
      /* Perfil "kratos" de diagram-design: tokens de src/styles/theme.css. Sigue el sistema y, dentro de /docs, el tema elegido. */
      .dg { --dg-paper: #ffffff; --dg-nodo: #ffffff; --dg-ink: #0a0a0c; --dg-muted: #4b4e59; --dg-soft: #5a5d68; --dg-rule: rgba(10, 10, 12, 0.12); --dg-tenue: rgba(10, 10, 12, 0.04); --dg-acento: #0d34e9; --dg-acento-tinte: rgba(13, 52, 233, 0.08); --dg-link: #6100df; }
      @media (prefers-color-scheme: dark) {
        .dg { --dg-paper: #121214; --dg-nodo: #1c1c21; --dg-ink: #ffffff; --dg-muted: #c2c5ce; --dg-soft: #a3a6b1; --dg-rule: rgba(255, 255, 255, 0.12); --dg-tenue: rgba(255, 255, 255, 0.05); --dg-acento: #3d8dfc; --dg-acento-tinte: rgba(61, 141, 252, 0.14); --dg-link: #b59cf0; }
      }
      :root[data-theme='light'] .dg { --dg-paper: #ffffff; --dg-nodo: #ffffff; --dg-ink: #0a0a0c; --dg-muted: #4b4e59; --dg-soft: #5a5d68; --dg-rule: rgba(10, 10, 12, 0.12); --dg-tenue: rgba(10, 10, 12, 0.04); --dg-acento: #0d34e9; --dg-acento-tinte: rgba(13, 52, 233, 0.08); --dg-link: #6100df; }
      :root[data-theme='dark'] .dg { --dg-paper: #121214; --dg-nodo: #1c1c21; --dg-ink: #ffffff; --dg-muted: #c2c5ce; --dg-soft: #a3a6b1; --dg-rule: rgba(255, 255, 255, 0.12); --dg-tenue: rgba(255, 255, 255, 0.05); --dg-acento: #3d8dfc; --dg-acento-tinte: rgba(61, 141, 252, 0.14); --dg-link: #b59cf0; }
      .dg { fill: none; stroke: none; }
      .dg text { stroke: none; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--dg-ink); }
      .dg .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .dg .fondo, .dg .mascara { fill: var(--dg-paper); }
      .dg .nodo { fill: var(--dg-nodo); stroke: var(--dg-ink); stroke-width: 1; }
      .dg .hoja { fill: var(--dg-nodo); stroke: var(--dg-muted); stroke-width: 0.8; }
      .dg .foco { fill: var(--dg-acento-tinte); stroke: var(--dg-acento); stroke-width: 1.2; }
      .dg .union { fill: var(--dg-tenue); stroke: var(--dg-muted); stroke-width: 1; stroke-dasharray: 4 3; }
      .dg .almacen { fill: var(--dg-tenue); stroke: var(--dg-muted); stroke-width: 1; }
      .dg .cabecera { fill: var(--dg-tenue); }
      .dg .cabecera-foco { fill: var(--dg-acento-tinte); }
      .dg .separador { stroke: var(--dg-rule); stroke-width: 1; }
      .dg .etiqueta { fill: none; stroke: var(--dg-muted); stroke-width: 0.8; }
      .dg .etiqueta-foco { fill: none; stroke: var(--dg-acento); stroke-width: 0.8; }
      .dg .linea { fill: none; stroke: var(--dg-muted); stroke-width: 1; }
      .dg .linea-acento { fill: none; stroke: var(--dg-acento); stroke-width: 1.2; }
      .dg .linea-retorno { fill: none; stroke: var(--dg-muted); stroke-width: 1; stroke-dasharray: 5 4; }
      .dg .punta { fill: var(--dg-muted); }
      .dg .punta-acento { fill: var(--dg-acento); }
      .dg .muted { fill: var(--dg-muted); }
      .dg .soft { fill: var(--dg-soft); }
      .dg .acento { fill: var(--dg-acento); }
      .dg .regla { stroke: var(--dg-rule); stroke-width: 0.8; }
    </style>

  </defs>

  <rect class="fondo" width="100%" height="100%" />

  <!-- Conectores: se dibujan antes que los nodos -->
