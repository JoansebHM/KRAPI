  <rect class="etiqueta" x="200" y="256" width="28" height="12" rx="2" />
  <text class="mono muted" x="214" y="265" font-size="7" text-anchor="middle" letter-spacing="0.08em">RAÍZ</text>
  <text x="52" y="269" font-size="12" font-weight="600">App</text>
  <text class="mono muted" x="52" y="285" font-size="9">main.tsx · Router · Query · Auth</text>
