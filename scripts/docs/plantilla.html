<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Documentación de KIRA, el geovisor de Kratos Innovation Lab para el barrio Manila." />
    <meta name="theme-color" content="#ffffff" />
    <title>Documentación · KIRA</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230478FB'/%3E%3Cpath d='M9 7h9a5 5 0 0 1 0 10h-4l6 8M9 7v18' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Mismo tema que la app (clave "krapi-theme"), aplicado antes de dibujar para que no parpadee.
      ;(function () {
        var tema = null
        try {
          tema = localStorage.getItem('krapi-theme')
        } catch (e) {}
        if (tema !== 'light' && tema !== 'dark') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
      })()
    </script>
    <style>
      /* Tokens de src/styles/theme.css (Manual de marca Kratos 2026, versión Innovation Lab). */
      @font-face {
        font-family: 'Good Times';
        src: local('Good Times'), local('GoodTimes-Regular'), local('Good Times Regular');
        font-display: swap;
      }

      :root {
        --kratos-azul-cielo: #0478fb;
        --kratos-azul-electrico: #0d34e9;
        --kratos-lila: #9e7ae1;
        --kratos-amarillo-neon: #deff5d;

        --font-display: 'Good Times', 'Poppins', system-ui, sans-serif;
        --font-sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;

        --alto-barra: 60px;
        --ancho-menu: 280px;
        --ancho-indice: 230px;

        color-scheme: light;
        --color-bg: #ffffff;
        --color-surface: #f3f4f7;
        --color-text: #0a0a0c;
        --color-text-muted: #5a5d68;
        --color-border: rgba(10, 10, 12, 0.12);
        --color-accent: var(--kratos-azul-electrico);
        --color-focus: var(--kratos-azul-electrico);
        --color-activo-bg: #eaf2ff;
        --color-codigo-linea-bg: rgba(13, 52, 233, 0.08);
        --sombra: 0 12px 32px rgba(10, 10, 12, 0.18);

        /* Monokai, igual en ambos temas */
        --mk-fondo: #272822;
        --mk-barra: #1e1f1c;
        --mk-texto: #f8f8f2;
        --mk-comentario: #88846f;
        --mk-cadena: #e6db74;
        --mk-clave: #f92672;
        --mk-funcion: #a6e22e;
        --mk-parametro: #fd971f;
        --mk-numero: #ae81ff;
        --mk-tipo: #66d9ef;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --color-bg: #121214;
        --color-surface: #1c1c21;
        --color-text: #ffffff;
        --color-text-muted: #a3a6b1;
        --color-border: rgba(255, 255, 255, 0.12);
        --color-accent: #3d8dfc;
        --color-focus: var(--kratos-amarillo-neon);
        --color-activo-bg: #0f2747;
        --color-codigo-linea-bg: rgba(61, 141, 252, 0.16);
        --sombra: 0 12px 32px rgba(0, 0, 0, 0.5);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-padding-top: calc(var(--alto-barra) + 20px);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font: 400 16px/1.65 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--color-accent);
        text-underline-offset: 3px;
      }

      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* Íconos de la interfaz (los diagramas, .dg, traen sus propios estilos). */
      svg:not(.dg) {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .solo-lector {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* ---------- Barra superior ---------- */

      .barra {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 12px;
        height: var(--alto-barra);
        padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        background: color-mix(in srgb, var(--color-bg) 88%, transparent);
        backdrop-filter: saturate(1.4) blur(10px);
        border-bottom: 1px solid var(--color-border);
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        text-decoration: none;
        min-width: 0;
      }

      .marca-texto {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }

      .marca-nombre {
        display: inline-flex;
        align-items: baseline;
      }

      /* Las letras KI son las del logo de Kratos Innovation Team (ver src/components/marcaKi.ts). */
      .marca-ki {
        height: 0.72em;
        width: auto;
        aspect-ratio: 386 / 250;
        margin-right: 0.08em;
        fill: var(--kratos-azul-cielo);
      }

      .marca-ki-tallo {
        fill: var(--color-text);
      }

      .marca-nombre {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 1.3rem;
        letter-spacing: 0.04em;
        color: var(--kratos-azul-cielo);
      }

      .marca-firma {
        font-size: 0.68rem;
        color: var(--color-text-muted);
        margin-top: 3px;
      }

      .marca-firma abbr {
        text-decoration: none;
        font-weight: 700;
        color: var(--color-text);
      }

      .etiqueta-docs {
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--kratos-amarillo-neon);
        color: #000;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .barra-acciones {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--color-text);
        cursor: pointer;
      }

      .icon-btn:hover {
        background: var(--color-surface);
      }

      .btn-app {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 12px;
        background: var(--kratos-azul-electrico);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }

      .btn-app svg {
        width: 18px;
        height: 18px;
      }

      #abrir-menu {
        display: none;
      }

      .tema-oscuro {
        display: none;
      }

      :root[data-theme='dark'] .tema-oscuro {
        display: block;
      }

      :root[data-theme='dark'] .tema-claro {
        display: none;
      }

      /* ---------- Marco de tres columnas ---------- */

      .marco {
        display: grid;
        grid-template-columns: var(--ancho-menu) minmax(0, 1fr) var(--ancho-indice);
        max-width: 1440px;
        margin: 0 auto;
      }

      .lateral {
        position: sticky;
        top: var(--alto-barra);
        height: calc(100vh - var(--alto-barra));
        height: calc(100dvh - var(--alto-barra));
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }

      /* ---------- Menú izquierdo ---------- */

      .menu {
        padding: 20px 12px 40px;
        border-right: 1px solid var(--color-border);
      }

      .buscador {
        position: relative;
        margin: 0 4px 16px;
      }

      .buscador svg {
        position: absolute;
        left: 12px;
        top: 50%;
        translate: 0 -50%;
        width: 18px;
        height: 18px;
        color: var(--color-text-muted);
        pointer-events: none;
      }

      .buscador input {
        width: 100%;
        height: 44px;
        padding: 0 12px 0 40px;
        border: 1px solid var(--color-border);
        border-radius: 12px;
        background: var(--color-surface);
        color: var(--color-text);
        font: inherit;
        font-size: 0.95rem;
      }

      .buscador input::placeholder {
        color: var(--color-text-muted);
      }

      .nav-grupo {
        margin-bottom: 8px;
      }

      .nav-grupo summary {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 10px;
        list-style: none;
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-muted);
      }

      .nav-grupo summary::-webkit-details-marker {
        display: none;
      }

      .nav-grupo summary::after {
        content: '';
        margin-left: auto;
        width: 7px;
        height: 7px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        rotate: -45deg;
        transition: rotate 0.15s;
      }

      .nav-grupo[open] summary::after {
        rotate: 45deg;
      }

      .nav-grupo summary svg {
        width: 18px;
        height: 18px;
        color: var(--kratos-azul-cielo);
      }

      .menu ul {
        list-style: none;
        margin: 2px 0 0;
        padding: 0;
      }

      #navegacion li a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 8px 12px 8px 40px;
        border-radius: 10px;
        color: var(--color-text);
        text-decoration: none;
        font-size: 0.93rem;
        line-height: 1.35;
      }

      #navegacion li a:hover {
        background: var(--color-surface);
      }

      #navegacion li a[aria-current='page'] {
        background: var(--color-activo-bg);
        color: var(--color-accent);
        font-weight: 600;
      }

      .nav-numero {
        flex: none;
        font: 600 0.72rem var(--font-mono);
        color: var(--color-text-muted);
      }

      .resultados {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .resultados a {
        display: block;
        padding: 10px 12px;
        border-radius: 10px;
        color: var(--color-text);
        text-decoration: none;
      }

      .resultados a:hover,
      .resultados a:focus-visible {
        background: var(--color-surface);
      }

      .resultados strong {
        display: block;
        font-size: 0.93rem;
      }

      .resultados span {
        display: block;
        font-size: 0.82rem;
        color: var(--color-text-muted);
        line-height: 1.45;
      }

      .resultados mark {
        background: var(--kratos-amarillo-neon);
        color: #000;
        border-radius: 3px;
      }

      .sin-resultados {
        padding: 10px 12px;
        color: var(--color-text-muted);
        font-size: 0.9rem;
      }

      /* ---------- Contenido ---------- */

      main {
        min-width: 0;
        padding: 40px clamp(16px, 5vw, 64px) 64px;
      }

      article {
        max-width: 780px;
        margin: 0 auto;
      }

      .antetitulo {
        margin: 0 0 6px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-accent);
      }

      h1,
      h2,
      h3,
      h4 {
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        font-weight: 800;
      }

      h2 {
        margin: 48px 0 14px;
        padding-top: 20px;
        border-top: 1px solid var(--color-border);
        font-size: 1.5rem;
        font-weight: 700;
      }

      h3 {
        margin: 32px 0 10px;
        font-size: 1.15rem;
        font-weight: 700;
      }

      h4 {
        margin: 24px 0 8px;
        font-size: 1rem;
      }

      h2:hover .ancla,
      h3:hover .ancla,
      .ancla:focus-visible {
        opacity: 1;
      }

      .ancla {
        margin-left: 8px;
        color: var(--color-text-muted);
        text-decoration: none;
        opacity: 0;
        transition: opacity 0.15s;
      }

      p,
      ul,
      ol {
        margin: 0 0 16px;
      }

      li {
        margin: 6px 0;
      }

      li > ul,
      li > ol {
        margin: 6px 0 0;
      }

      strong {
        font-weight: 700;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--color-codigo-linea-bg);
        color: var(--color-text);
        font: 0.86em var(--font-mono);
        overflow-wrap: anywhere;
      }

      a code {
        color: inherit;
      }

      blockquote {
        margin: 20px 0;
        padding: 14px 18px;
        border-left: 4px solid var(--kratos-azul-cielo);
        border-radius: 0 12px 12px 0;
        background: var(--color-surface);
      }

      blockquote p:last-child {
        margin: 0;
      }

      .tabla {
        margin: 0 0 20px;
        overflow-x: auto;
        border: 1px solid var(--color-border);
        border-radius: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th,
      td {
        padding: 10px 14px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--color-border);
      }

      th {
        background: var(--color-surface);
        font-weight: 700;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td:first-child {
        min-width: 120px;
      }

      .estado {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--color-activo-bg);
        color: var(--color-accent);
        font-size: 0.88rem;
      }

      a.issue {
        font-weight: 600;
      }

      /* Diagramas (docs/diagramas, hechos con la skill diagram-design y el perfil "kratos") */

      .diagrama {
        margin: 8px 0 28px;
      }

      .diagrama-scroll {
        overflow-x: auto;
      }

      .diagrama svg {
        display: block;
        width: 100%;
        height: auto;
      }

      @media print {
        .diagrama-scroll {
          overflow-x: visible;
        }
        .diagrama svg {
          min-width: 0 !important;
        }
      }

      /* Bloques de código (Monokai) */

      .codigo {
        margin: 0 0 20px;
        overflow: hidden;
        border-radius: 12px;
        background: var(--mk-fondo);
        box-shadow: 0 1px 0 var(--color-border);
      }

      .codigo figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 4px 16px;
        background: var(--mk-barra);
        color: var(--mk-comentario);
        font: 600 0.75rem var(--font-sans);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .copiar {
        min-height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--mk-texto);
        font: 500 0.8rem var(--font-sans);
        cursor: pointer;
      }

      .copiar:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .codigo pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        color: var(--mk-texto);
        font: 0.86rem/1.6 var(--font-mono);
        tab-size: 2;
      }

      .codigo code {
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
        overflow-wrap: normal;
      }

      .mk-comentario {
        color: var(--mk-comentario);
        font-style: italic;
      }
      .mk-cadena {
        color: var(--mk-cadena);
      }
      .mk-clave {
        color: var(--mk-clave);
      }
      .mk-funcion {
        color: var(--mk-funcion);
      }
      .mk-parametro {
        color: var(--mk-parametro);
      }
      .mk-numero {
        color: var(--mk-numero);
      }
      .mk-tipo {
        color: var(--mk-tipo);
      }

      /* Portada del inicio */

      .portada {
        margin: 0 0 28px;
        padding: 32px 28px;
        border-radius: 20px;
        background:
          radial-gradient(circle at 100% 0%, rgba(222, 255, 93, 0.35), transparent 45%),
          linear-gradient(135deg, var(--kratos-azul-cielo), var(--kratos-azul-electrico));
        color: #fff;
      }

      .portada .antetitulo {
        color: var(--kratos-amarillo-neon);
      }

      .portada h1 {
        margin-bottom: 10px;
        font-family: var(--font-display);
      }

      .portada p:last-child {
        margin: 0;
        max-width: 560px;
        opacity: 0.92;
      }

      .tarjetas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
        margin: 0 0 36px;
      }

      .tarjeta {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 18px;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        color: var(--color-text);
        text-decoration: none;
        transition:
          border-color 0.15s,
          translate 0.15s,
          box-shadow 0.15s;
      }

      .tarjeta:hover {
        border-color: var(--kratos-azul-cielo);
        translate: 0 -2px;
        box-shadow: var(--sombra);
      }

      .tarjeta svg {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
        color: var(--kratos-azul-cielo);
      }

      .tarjeta span {
        font-size: 0.88rem;
        line-height: 1.5;
        color: var(--color-text-muted);
      }

      /* Pie de cada página */

      .pie-pagina {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--color-border);
        font-size: 0.88rem;
        color: var(--color-text-muted);
      }

      .pasos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }

      .paso {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 44px;
        padding: 14px 16px;
        border: 1px solid var(--color-border);
        border-radius: 12px;
        color: var(--color-text);
        text-decoration: none;
      }

      .paso:hover {
        border-color: var(--kratos-azul-cielo);
      }

      .paso span {
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }

      .paso strong {
        color: var(--color-accent);
      }

      .paso.siguiente {
        grid-column: 2;
        text-align: right;
      }

      /* ---------- Índice derecho ---------- */

      .indice {
        padding: 40px 16px 40px 8px;
      }

      .indice:not(:has(li)) h2 {
        display: none;
      }

      .indice h2,
      .toc-movil summary {
        margin: 0 0 10px;
        padding: 0;
        border: 0;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-text-muted);
      }

      .indice ul,
      .toc-movil ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 2px solid var(--color-border);
      }

      .indice li,
      .toc-movil li {
        margin: 0;
      }

      .indice a,
      .toc-movil a {
        display: block;
        margin-left: -2px;
        padding: 6px 0 6px 14px;
        border-left: 2px solid transparent;
        color: var(--color-text-muted);
        text-decoration: none;
        font-size: 0.86rem;
        line-height: 1.4;
      }

      .indice a.nivel-3,
      .toc-movil a.nivel-3 {
        padding-left: 28px;
        font-size: 0.82rem;
      }

      .indice a:hover {
        color: var(--color-text);
      }

      .indice a.activo {
        border-left-color: var(--kratos-azul-cielo);
        color: var(--color-accent);
        font-weight: 600;
      }

      .toc-movil {
        display: none;
        margin: 0 0 24px;
        padding: 0 16px;
        border: 1px solid var(--color-border);
        border-radius: 12px;
      }

      .toc-movil summary {
        display: flex;
        align-items: center;
        min-height: 48px;
        margin: 0;
        cursor: pointer;
      }

      .toc-movil nav {
        padding-bottom: 12px;
      }

      .toc-movil a {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      /* ---------- Pantallas medianas y celular ---------- */

      @media (max-width: 1199px) {
        .marco {
          grid-template-columns: var(--ancho-menu) minmax(0, 1fr);
        }
        .indice {
          display: none;
        }
        .toc-movil:has(li) {
          display: block;
        }
      }

      @media (max-width: 899px) {
        .marco {
          display: block;
        }
        #abrir-menu {
          display: inline-grid;
          margin-left: -8px;
        }
        .menu {

    <script>
      ;(function () {
        var articulos = Array.prototype.slice.call(document.querySelectorAll('main > article'))
        var enlacesMenu = Array.prototype.slice.call(document.querySelectorAll('#navegacion a[data-pagina]'))
        var indice = document.querySelector('.indice nav')
        var actual = null
        var titulosActuales = []

        /* ---------- Rutas: #/pagina/seccion ---------- */

        function leerRuta() {
          var m = location.hash.match(/^#\/([^/]+)(?:\/(.+))?$/)
          var pagina = m && document.getElementById('pagina-' + m[1]) ? m[1] : 'inicio'
          return { pagina: pagina, seccion: m && m[1] === pagina ? decodeURIComponent(m[2] || '') : '' }
        }

        function construirIndice(articulo, id) {
          var titulos = Array.prototype.slice.call(articulo.querySelectorAll('h2[id], h3[id]'))
          var html = titulos
            .map(function (t) {
              var seccion = t.id.slice(id.length + 2)
              var texto = t.cloneNode(true)
              var ancla = texto.querySelector('.ancla')
              if (ancla) ancla.remove()
              return (
                '<li><a class="nivel-' + t.tagName.slice(1) + '" href="#/' + id + '/' + seccion + '" data-seccion="' + t.id + '">' +
                texto.textContent.replace(/[&<>"]/g, function (c) {
                  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
                }) +
                '</a></li>'
              )
            })
            .join('')
          var lista = html ? '<ul>' + html + '</ul>' : ''
          indice.innerHTML = lista
          articulo.querySelector('.toc-movil nav').innerHTML = lista
          return titulos
        }

        function mostrar() {
          var ruta = leerRuta()
          var cambioDePagina = actual !== ruta.pagina

          if (cambioDePagina) {
            articulos.forEach(function (a) {
              a.hidden = a.id !== 'pagina-' + ruta.pagina
            })
            var articulo = document.getElementById('pagina-' + ruta.pagina)
            enlacesMenu.forEach(function (a) {
              if (a.dataset.pagina === ruta.pagina) {
                a.setAttribute('aria-current', 'page')
                a.closest('details').open = true
              } else {
                a.removeAttribute('aria-current')
              }
            })
            titulosActuales = construirIndice(articulo, ruta.pagina)
            document.title = (ruta.pagina === 'inicio' ? 'Documentación' : articulo.dataset.titulo) + ' · KIRA'
            actual = ruta.pagina
          }

          cerrarMenu()
          var destino = ruta.seccion && document.getElementById(ruta.pagina + '--' + ruta.seccion)
          if (destino) {
            destino.scrollIntoView()
          } else if (cambioDePagina) {
            window.scrollTo(0, 0)
          }
          marcarSeccionActiva()
        }

        /* ---------- Índice derecho: sección visible ---------- */

        function marcarSeccionActiva() {
          var activo = null
          for (var i = 0; i < titulosActuales.length; i++) {
            if (titulosActuales[i].getBoundingClientRect().top < 140) activo = titulosActuales[i].id
            else break
          }
          if (!activo && titulosActuales.length) activo = titulosActuales[0].id
          Array.prototype.forEach.call(indice.querySelectorAll('a'), function (a) {
            a.classList.toggle('activo', a.dataset.seccion === activo)
          })
        }

        var pendiente = false
        window.addEventListener(
          'scroll',
          function () {
            if (pendiente) return
            pendiente = true
            requestAnimationFrame(function () {
              pendiente = false
              marcarSeccionActiva()
            })
          },
          { passive: true },
        )

        window.addEventListener('hashchange', mostrar)

        /* ---------- Menú en celular ---------- */

        var botonMenu = document.getElementById('abrir-menu')
        var velo = null

        function cerrarMenu() {
          if (!document.body.classList.contains('menu-abierto')) return
          document.body.classList.remove('menu-abierto')
          botonMenu.setAttribute('aria-expanded', 'false')
          botonMenu.setAttribute('aria-label', 'Abrir menú')
          if (velo) velo.remove()
        }

        botonMenu.addEventListener('click', function () {
          if (document.body.classList.contains('menu-abierto')) return cerrarMenu()
          document.body.classList.add('menu-abierto')
          botonMenu.setAttribute('aria-expanded', 'true')
          botonMenu.setAttribute('aria-label', 'Cerrar menú')
          velo = document.createElement('div')
          velo.className = 'velo'
          velo.addEventListener('click', cerrarMenu)
          document.body.appendChild(velo)
        })

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') cerrarMenu()
        })

        document.querySelector('.menu').addEventListener('click', function (e) {
          if (e.target.closest('a')) cerrarMenu()
        })

        /* ---------- Tema claro / oscuro ---------- */

        var botonTema = document.getElementById('cambiar-tema')
        function aplicarTema(tema) {
          document.documentElement.dataset.theme = tema
          botonTema.setAttribute('aria-label', tema === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro')
          document.querySelector('meta[name="theme-color"]').content = tema === 'dark' ? '#121214' : '#ffffff'
        }
        aplicarTema(document.documentElement.dataset.theme)
        botonTema.addEventListener('click', function () {
          var tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
          aplicarTema(tema)
          try {
            localStorage.setItem('krapi-theme', tema)
          } catch (e) {}
        })

        /* ---------- Copiar código ---------- */

        document.addEventListener('click', function (e) {
          var boton = e.target.closest('.copiar')
          if (!boton) return
          var texto = boton.closest('.codigo').querySelector('code').textContent
          var listo = function () {
            boton.textContent = 'Copiado'
            setTimeout(function () {
              boton.textContent = 'Copiar'
            }, 1500)
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(texto).then(listo)
          } else {
            var area = document.createElement('textarea')
            area.value = texto
            document.body.appendChild(area)
            area.select()
            document.execCommand('copy')
            area.remove()
            listo()
          }
        })

        /* ---------- Buscador ---------- */

        function normalizar(texto) {
          // Quita tildes letra por letra para que las posiciones coincidan con el texto original.
          return texto.replace(/[^\x00-\x7f]/g, function (c) {
            var base = c.normalize('NFD').replace(/[̀-ͯ]/g, '')
            return base.length === 1 ? base : c
          }).toLowerCase()
        }

        var paginasBusqueda = articulos.map(function (a) {
          var copia = a.cloneNode(true)
          Array.prototype.forEach.call(copia.querySelectorAll('.toc-movil, .pie-pagina, .ancla, figcaption, style'), function (n) {
            n.remove()
          })
          // Separa los bloques para que el texto de celdas y párrafos vecinos no quede pegado.
          Array.prototype.forEach.call(copia.querySelectorAll('p, li, td, th, h1, h2, h3, h4, pre, a.tarjeta > strong'), function (n) {
            n.append(' ')
          })
          var texto = copia.textContent.replace(/\s+/g, ' ').trim()
          return { id: a.id.slice(7), titulo: a.dataset.titulo, texto: texto, normal: normalizar(texto), tituloNormal: normalizar(a.dataset.titulo) }
        })

        var campo = document.getElementById('buscar')
        var navegacion = document.getElementById('navegacion')
        var busqueda = document.getElementById('busqueda')
        var listaResultados = busqueda.querySelector('ul')

        function escaparHtml(texto) {
          return texto.replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }

        function buscar() {
          var consulta = normalizar(campo.value.trim())
          navegacion.hidden = Boolean(consulta)
          busqueda.hidden = !consulta
          if (!consulta) return

          var terminos = consulta.split(/\s+/)
          var resultados = paginasBusqueda
            .filter(function (p) {
              return terminos.every(function (t) {
                return p.normal.indexOf(t) !== -1
              })
            })
            .sort(function (a, b) {
              return (b.tituloNormal.indexOf(terminos[0]) !== -1) - (a.tituloNormal.indexOf(terminos[0]) !== -1)
            })

          if (!resultados.length) {
            listaResultados.innerHTML = '<li class="sin-resultados">Sin resultados para «' + escaparHtml(campo.value.trim()) + '».</li>'
            return
          }

          listaResultados.innerHTML = resultados
            .map(function (p) {
              var posicion = p.normal.indexOf(terminos[0])
              var inicio = Math.max(0, posicion - 40)
              var fragmento = p.texto.slice(inicio, posicion) + '\u0001' + p.texto.slice(posicion, posicion + terminos[0].length) + '\u0002' + p.texto.slice(posicion + terminos[0].length, posicion + 90)
              fragmento = escaparHtml(fragmento).replace('\u0001', '<mark>').replace('\u0002', '</mark>')
              return '<li><a href="#/' + p.id + '"><strong>' + escaparHtml(p.titulo) + '</strong><span>' + (inicio > 0 ? '…' : '') + fragmento + '…</span></a></li>'
            })
            .join('')
        }

        campo.addEventListener('input', buscar)
        campo.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            var primero = listaResultados.querySelector('a')
            if (primero) location.hash = primero.getAttribute('href')
          } else if (e.key === 'Escape') {
            campo.value = ''
            buscar()
          }
        })
        listaResultados.addEventListener('click', function () {
          campo.value = ''
          buscar()
        })

        mostrar()
      })()
    </script>
  </body>
</html>
